<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Clôture WeMakeIt</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.5.3/vue.min.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <link rel="stylesheet" href="wemakeit_cloture.css">
</head>
<body>
<div id="app">

  <h1 class="form-title">La Ferme Chautems – WeMakeIt</h1>

  <div v-if="status" class="status-msg error">{{ status }}</div>

  <template v-if="!submitted">
    <div class="form-card">

      <div class="field-group">
        <label class="field-label">Votre nom</label>
        <select v-model="selectedId" class="field-select" @change="onPersonSelect">
          <option value="">— Sélectionnez votre nom —</option>
          <option v-for="p in people" :key="p.id" :value="p.id">{{ p.full_name }}</option>
        </select>
      </div>

      <template v-if="selectedId">

        <div class="field-group">
          <label class="field-label">Taille du T-shirt</label>
          <div class="btn-group">
            <button v-for="s in sizes" :key="s"
                    class="choice-btn" :class="{ active: form.tshirt_size === s }"
                    @click="form.tshirt_size = s">{{ s }}</button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Variante préférée</label>
          <div class="btn-group">
            <button v-for="v in variants" :key="v"
                    class="choice-btn wide" :class="{ active: form.prefered_version === v }"
                    @click="form.prefered_version = v">{{ v }}</button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Livraison</label>
          <div class="btn-group vertical">
            <button v-for="opt in deliveryOptions" :key="opt"
                    class="choice-btn wide" :class="{ active: form.delivery === opt }"
                    @click="form.delivery = opt">{{ opt }}</button>
          </div>
        </div>

        <button class="submit-btn" @click="submit" :disabled="!canSubmit || saving">
          {{ saving ? 'Enregistrement…' : 'Confirmer mes choix' }}
        </button>

      </template>
    </div>
  </template>

  <template v-else>
    <div class="success-card">
      <div class="success-icon">✓</div>
      <p class="success-name">Merci, <strong>{{ submittedName }}</strong> !</p>
      <p class="success-detail">Vos préférences ont bien été enregistrées.</p>
      <div class="success-summary">
        <span>T-shirt : <strong>{{ form.tshirt_size }}</strong></span>
        <span>Variante : <strong>{{ form.prefered_version }}</strong></span>
        <span>Livraison : <strong>{{ form.delivery }}</strong></span>
      </div>
      <button class="reset-btn" @click="reset">Modifier mes réponses</button>
    </div>
  </template>

</div>
<script src="wemakeit_cloture.js"></script>
</body>
</html>
